- name: Restart wazuh-manager
  ansible.builtin.systemd:
    name: wazuh-manager
    state: restarted

- name: Restart wazuh-indexer
  ansible.builtin.systemd:
    name: wazuh-indexer
    state: restarted

- name: Restart wazuh-dashboard
  ansible.builtin.systemd:
    name: wazuh-dashboard
    state: restarted

- name: Run security init
  ansible.builtin.command: /usr/share/wazuh-indexer/bin/indexer-security-init.sh
  environment:
    OPENSEARCH_JAVA_HOME: /usr/share/wazuh-indexer/jdk
    JAVA_HOME: /usr/share/wazuh-indexer/jdk
  notify: Restart wazuh-indexer