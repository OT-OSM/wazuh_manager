# =====================================================
# Display Verification Summary
# =====================================================

- name: Display RBAC verification summary
  ansible.builtin.debug:
    msg:
      - "Users                   : {{ wazuh_verify_users.json.data.total_affected_items | default(0) }}"
      - "Roles                   : {{ wazuh_verify_roles.json.data.total_affected_items | default(0) }}"
      - "Policies                : {{ wazuh_verify_policies.json.data.total_affected_items | default(0) }}"
      - "Rules                   : {{ wazuh_verify_rules.json.data.total_affected_items | default(0) }}"
      - "Role → Policy Mappings  : {{ wazuh_api_rbac_role_policy_mappings | length }}"
      - "Role → Rule Mappings    : {{ wazuh_api_rbac_role_rule_mappings | length }}"
      - "User → Role Mappings    : {{ wazuh_api_rbac_user_role_mappings | length }}"
      - "Wazuh API RBAC verification completed successfully."
  tags:
    - wazuh
    - rbac
    - verify