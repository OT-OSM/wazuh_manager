---
# =====================================================
# Wazuh API RBAC Verification
# =====================================================

- name: Verify Wazuh API authentication token
  ansible.builtin.assert:
    that:
      - wazuh_api_rbac_token is defined
      - wazuh_api_rbac_token | length > 0
    fail_msg: "Wazuh API JWT token is missing."
    success_msg: "Wazuh API authentication verified."
  tags:
    - wazuh
    - rbac
    - verify

# =====================================================
# Verify Users
# =====================================================

- name: Get configured Wazuh API users
  ansible.builtin.uri:
    url: "{{ wazuh_api_rbac_url }}/security/users"
    method: GET
    headers:
      Authorization: "Bearer {{ wazuh_api_rbac_token }}"
    validate_certs: "{{ wazuh_api_rbac_validate_certs }}"
    return_content: true
    status_code: 200
  register: wazuh_verify_users
  retries: 5
  delay: 5
  until: wazuh_verify_users.status == 200
  changed_when: false
  failed_when:
    - wazuh_verify_users.status != 200
  tags:
    - wazuh
    - rbac
    - verify

- name: Verify configured users exist
  ansible.builtin.assert:
    that:
      - >
        (
          wazuh_api_rbac_users
          | map(attribute='name')
          | difference(
              wazuh_verify_users.json.data.affected_items
              | map(attribute='username')
              | list
            )
          | length
        ) == 0
    fail_msg: "One or more configured users were not created successfully."
    success_msg: "All configured users verified."

