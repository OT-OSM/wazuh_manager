- name: Configure Wazuh API Role Policy Mappings
  ansible.builtin.include_tasks: rbac_api_role_policy_mappings.yml
  when: wazuh_api_rbac_role_policy_mappings | length > 0
  tags:
    - wazuh
    - rbac
