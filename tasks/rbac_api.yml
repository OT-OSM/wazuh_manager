# Verify RBAC Configuration
# =====================================================

- name: Verify Wazuh API RBAC configuration
  ansible.builtin.include_tasks: rbac_api_verify.yml
  when: wazuh_api_rbac_verify | bool
  tags:
    - wazuh
    - rbac
    - verify