---
# =====================================================
# Render Configuration Files
# =====================================================

- name: Configure Manager
  ansible.builtin.template:
    src: manager.conf.j2
    dest: "{{ wazuh_manager_config_file }}"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0640"
  notify: Restart wazuh-manager
  when: wazuh_manager_enabled | bool

- name: Configure Indexer
  ansible.builtin.template:
    src: indexer.yml.j2
    dest: "{{ wazuh_indexer_config_file }}"
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0640"
  notify: Restart wazuh-indexer
  when: wazuh_indexer_enabled | bool


- name: Configure Dashboard
  ansible.builtin.template:
    src: dashboard.yml.j2
    dest: "{{ wazuh_dashboard_config_file }}"
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0640"
  notify: Restart wazuh-dashboard
  when: wazuh_dashboard_enabled | bool


# =====================================================
# Dashboard TLS Validation
# =====================================================

- name: Ensure dashboard cert directory exists
  ansible.builtin.file:
    path: "{{ wazuh_dashboard_cert_file | dirname }}"
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0750"
  when:
    - wazuh_dashboard_ssl_enabled | bool
    - wazuh_dashboard_cert_file | length > 0


- name: Check dashboard certificate exists
  ansible.builtin.stat:
    path: "{{ wazuh_dashboard_cert_file }}"
  register: dashboard_cert_stat
  when: wazuh_dashboard_ssl_enabled | bool


- name: Check dashboard key exists
  ansible.builtin.stat:
    path: "{{ wazuh_dashboard_key_file }}"
  register: dashboard_key_stat
  when: wazuh_dashboard_ssl_enabled | bool


- name: Fail if dashboard certificate missing
  ansible.builtin.fail:
    msg: "Dashboard SSL certificate not found at {{ wazuh_dashboard_cert_file }}"
  when:
    - wazuh_dashboard_ssl_enabled | bool
    - not dashboard_cert_stat.stat.exists


- name: Fail if dashboard key missing
  ansible.builtin.fail:
    msg: "Dashboard SSL key not found at {{ wazuh_dashboard_key_file }}"
  when:
    - wazuh_dashboard_ssl_enabled | bool
    - not dashboard_key_stat.stat.exists


- name: Fix dashboard certificate permissions
  ansible.builtin.file:
    path: "{{ wazuh_dashboard_cert_file }}"
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0644"
  when:
    - wazuh_dashboard_ssl_enabled | bool
    - dashboard_cert_stat.stat.exists


- name: Fix dashboard key permissions
  ansible.builtin.file:
    path: "{{ wazuh_dashboard_key_file }}"
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0600"
  when:
    - wazuh_dashboard_ssl_enabled | bool
    - dashboard_key_stat.stat.exists


# =====================================================
# Allow Dashboard to Read Indexer TLS Certificates
# =====================================================

- name: Ensure ACL package installed
  ansible.builtin.package:
    name: acl
    state: present
  when:
    - wazuh_tls_enabled | bool
    - wazuh_dashboard_enabled | bool


- name: Allow dashboard to read indexer certs
  ansible.posix.acl:
    path: "{{ item }}"
    entity: wazuh-dashboard
    etype: user
    permissions: r
    state: present
  loop:
    - "{{ wazuh_tls_admin_key_file }}"
    - "{{ wazuh_tls_admin_cert_file }}"
    - "{{ wazuh_tls_ca_file }}"
  when:
    - wazuh_tls_enabled | bool
    - wazuh_dashboard_enabled | bool


# =====================================================
# Ensure Directory Ownership
# =====================================================

- name: Ensure manager data directory ownership
  ansible.builtin.file:
    path: "{{ wazuh_data_dir }}"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0750"
  when: wazuh_manager_enabled | bool


- name: Ensure indexer data directory ownership
  ansible.builtin.file:
    path: "{{ wazuh_indexer_data_dir }}"
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0750"
  when: wazuh_indexer_enabled | bool


- name: Ensure wazuh indexer log directory ownership
  ansible.builtin.file:
    path: "{{ wazuh_log_dir }}"
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0750"

# =====================================================
# Generate password hashes for OpenSearch security
# =====================================================

- name: Generate admin password hash
  ansible.builtin.command: >
    /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh
    -p "{{ wazuh_admin_password }}"
  environment:
    JAVA_HOME: /usr/share/wazuh-indexer/jdk
    OPENSEARCH_JAVA_HOME: /usr/share/wazuh-indexer/jdk
  register: wazuh_admin_hash
  changed_when: false
  when: wazuh_indexer_enabled | bool

- name: Generate dashboard password hash
  ansible.builtin.command: >
    /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh
    -p "{{ wazuh_dashboard_service_password }}"
  environment:
    JAVA_HOME: /usr/share/wazuh-indexer/jdk
    OPENSEARCH_JAVA_HOME: /usr/share/wazuh-indexer/jdk
  register: wazuh_dashboard_hash
  changed_when: false
  when: wazuh_indexer_enabled | bool
  
# =====================================================
# Render Security Config Files
# =====================================================

- name: Render internal users config
  ansible.builtin.template:
    src: internal_users.yml.j2
    dest: /etc/wazuh-indexer/opensearch-security/internal_users.yml
    owner: "{{ wazuh_indexer_user }}"
    group: "{{ wazuh_indexer_user }}"
    mode: "0600"
  when: wazuh_indexer_enabled | bool


- name: Render roles mapping config
  ansible.builtin.template:
    src: roles_mapping.yml.j2
    dest: /etc/wazuh-indexer/opensearch-security/roles_mapping.yml
    owner: "{{ wazuh_indexer_user }}"
    group: "{{ wazuh_indexer_user }}"
    mode: "0600"
  when: wazuh_indexer_enabled | bool


# =====================================================
# JVM and Logrotate
# =====================================================

- name: Configure JVM heap
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ wazuh_indexer_jvm_file }}"
  notify: Restart wazuh-indexer


- name: Configure logrotate
  ansible.builtin.copy:
    dest: "{{ wazuh_logrotate_file }}"
    content: |
      {{ wazuh_log_dir }}/*.log {
        daily
        rotate {{ wazuh_log_retention_days }}
        compress
        missingok
      }


# =====================================================
# Manager Keystore
# =====================================================

- name: Ensure wazuh keystore directory exists
  ansible.builtin.file:
    path: /var/ossec/etc/keystore
    state: directory
    owner: wazuh
    group: wazuh
    mode: "0750"
  when: wazuh_manager_enabled | bool

- name: Configure indexer username in wazuh keystore
  command: >
    /var/ossec/bin/wazuh-keystore -f indexer -k username -v "{{ wazuh_indexer_username }}"
  when: wazuh_manager_enabled | bool


- name: Configure indexer password in wazuh keystore
  command: >
    /var/ossec/bin/wazuh-keystore -f indexer -k password -v "{{ wazuh_indexer_password }}"
  when: wazuh_manager_enabled | bool


# =====================================================
# Filebeat Configuration (As per Wazuh 4.14 documentation)
# =====================================================

# -----------------------------------------------------
# Render Filebeat configuration
# -----------------------------------------------------

- name: Configure Filebeat
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart filebeat

# -----------------------------------------------------
# Fix existing Filebeat keystore permissions if present
# -----------------------------------------------------

- name: Fix existing Filebeat keystore permissions
  ansible.builtin.file:
    path: /var/lib/filebeat/filebeat.keystore
    owner: root
    group: root
    mode: "0600"
  ignore_errors: true

# -----------------------------------------------------
# Create Filebeat keystore
# -----------------------------------------------------

- name: Create Filebeat keystore
  ansible.builtin.command: filebeat keystore create
  args:
    creates: /var/lib/filebeat/filebeat.keystore

# -----------------------------------------------------
# Ensure keystore permissions
# -----------------------------------------------------

- name: Ensure Filebeat keystore permissions
  ansible.builtin.file:
    path: /var/lib/filebeat/filebeat.keystore
    owner: root
    group: root
    mode: "0600"

# -----------------------------------------------------
# Add Filebeat username to keystore
# -----------------------------------------------------

- name: Add Filebeat username to keystore
  ansible.builtin.shell: |
    echo "{{ wazuh_indexer_username }}" | filebeat keystore add username --stdin --force
  changed_when: false

- name: Add Filebeat password to keystore
  ansible.builtin.shell: |
    echo "{{ wazuh_indexer_password }}" | filebeat keystore add password --stdin --force
  changed_when: false

# -----------------------------------------------------
# Download Wazuh alerts template
# -----------------------------------------------------

- name: Download Wazuh alerts template
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/wazuh/wazuh/v4.14.3/extensions/elasticsearch/7.x/wazuh-template.json"
    dest: /etc/filebeat/wazuh-template.json
    mode: "0644"


# -----------------------------------------------------
# Ensure template readable
# -----------------------------------------------------

- name: Ensure wazuh template permissions
  ansible.builtin.file:
    path: /etc/filebeat/wazuh-template.json
    mode: "0644"

# -----------------------------------------------------
# Deploy Filebeat certificates
# -----------------------------------------------------

- name: Create Filebeat cert directory
  ansible.builtin.file:
    path: /etc/filebeat/certs
    state: directory
    owner: root
    group: root
    mode: "0755"


- name: Move Filebeat certificate
  ansible.builtin.command: >
    mv {{ wazuh_certificates_dir }}/{{ wazuh_manager_node_name }}.pem /etc/filebeat/certs/filebeat.pem
  args:
    creates: /etc/filebeat/certs/filebeat.pem


- name: Move Filebeat key
  ansible.builtin.command: >
    mv {{ wazuh_certificates_dir }}/{{ wazuh_manager_node_name }}-key.pem /etc/filebeat/certs/filebeat-key.pem
  args:
    creates: /etc/filebeat/certs/filebeat-key.pem


- name: Copy root CA to Filebeat
  ansible.builtin.command: >
    cp {{ wazuh_tls_ca_file }} /etc/filebeat/certs/root-ca.pem
  args:
    creates: /etc/filebeat/certs/root-ca.pem

# -----------------------------------------------------
# Set certificate permissions
# -----------------------------------------------------

- name: Set Filebeat cert directory permissions
  ansible.builtin.file:
    path: /etc/filebeat/certs
    owner: root
    group: root
    mode: "0500"


- name: Set Filebeat certificate file permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0400"
  loop:
    - /etc/filebeat/certs/filebeat.pem
    - /etc/filebeat/certs/filebeat-key.pem
    - /etc/filebeat/certs/root-ca.pem

# =====================================================
# Deploy Wazuh Filebeat Module
# =====================================================

- name: Ensure Filebeat modules directory exists
  ansible.builtin.file:
    path: /etc/filebeat/modules.d
    state: directory
    owner: root
    group: root
    mode: "0755"


- name: Deploy Wazuh Filebeat module configuration
  ansible.builtin.copy:
    dest: /etc/filebeat/modules.d/wazuh.yml
    owner: root
    group: root
    mode: "0644"
    content: |
      - module: wazuh
        alerts:
          enabled: true
          var.paths:
            - /var/ossec/logs/alerts/alerts.json
        archives:
          enabled: false
  notify: Restart filebeat

# =====================================================
# Load Wazuh Filebeat ingest pipelines
# =====================================================

- name: Load Wazuh Filebeat ingest pipelines
  ansible.builtin.command: >
    filebeat setup --pipelines --modules wazuh
  register: filebeat_pipeline_setup
  changed_when: false
  when: wazuh_manager_enabled | bool

# =====================================================
# Ensure dashboard API config directory exists
# =====================================================

- name: Ensure Wazuh dashboard API config directory exists
  ansible.builtin.file:
    path: /usr/share/wazuh-dashboard/data/wazuh/config
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0755"
  when: wazuh_dashboard_enabled | bool

# =====================================================
# Configure Wazuh Dashboard API connection
# =====================================================

- name: Configure Wazuh dashboard API connection
  ansible.builtin.template:
    src: wazuh-dashboard-api.yml.j2
    dest: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0640"
  when: wazuh_dashboard_enabled | bool