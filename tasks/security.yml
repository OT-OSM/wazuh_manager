# =====================================================
# Wait for OpenSearch port (NOT health)
# =====================================================

- name: Wait for OpenSearch port
  wait_for:
    host: "{{ wazuh_runtime_host }}"
    port: "{{ wazuh_indexer_port }}"
    timeout: 60
  when: wazuh_indexer_enabled | bool

# =====================================================
# Check if security index exists
# =====================================================

- name: Check if security index exists
  uri:
    url: "https://{{ wazuh_runtime_host }}:{{ wazuh_indexer_port }}/.opendistro_security"
    method: GET
    user: "{{ wazuh_admin_user }}"
    password: "{{ wazuh_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: security_index
  failed_when: false
  when: wazuh_indexer_enabled | bool


# =====================================================
# Apply security ONLY if needed
# =====================================================

- name: Apply OpenSearch security configuration
  command: >
    /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh
    -cd /etc/wazuh-indexer/opensearch-security
    -key {{ wazuh_tls_admin_key_file }}
    -cert {{ wazuh_tls_admin_cert_file }}
    -cacert {{ wazuh_tls_ca_file }}
    -icl -nhnv
  environment:
    OPENSEARCH_JAVA_HOME: /usr/share/wazuh-indexer/jdk
    JAVA_HOME: /usr/share/wazuh-indexer/jdk
  register: security_apply
  changed_when: "'Done with success' in security_apply.stdout"
  when:
    - wazuh_tls_enabled | bool
    - wazuh_indexer_enabled | bool
    - security_index.status != 200


# =====================================================
# Restart ONLY if changed
# =====================================================

- name: Restart wazuh-indexer if security changed
  service:
    name: wazuh-indexer
    state: restarted
  when:
    - security_apply.changed


# =====================================================
# Wait for OpenSearch cluster readiness (NOT just port)
# =====================================================

- name: Wait for OpenSearch cluster health
  uri:
    url: "https://{{ wazuh_runtime_host }}:{{ wazuh_indexer_port }}/_cluster/health"
    method: GET
    user: "{{ wazuh_admin_user }}"
    password: "{{ wazuh_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: cluster_health
  retries: 30
  delay: 5
  until: "'green' in cluster_health.content or 'yellow' in cluster_health.content"
  when: wazuh_indexer_enabled | bool
